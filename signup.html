<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Join — Voyeur</title>
<link rel="icon" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500;1,600&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14111c;
    --panel:#1e1a26;
    --panel-2:#262030;
    --lilac:#b9a9e0;
    --sky:#a8c8e0;
    --fog:#8f8f99;
    --paper:#f1f0f4;
    --border:rgba(216,180,255,0.10);
    --border-strong:rgba(216,180,255,0.20);
    --error:#e08a8a;
    --success:#9ed6a8;
    --gradient-primary:linear-gradient(135deg, #9333ea, #d6409f);
    --accent-bar:#c026d3;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;
    background:radial-gradient(circle at 20% 0%, #2a1f3d 0%, var(--ink) 60%);color:var(--paper);
    font-family:'Montserrat',sans-serif;-webkit-font-smoothing:antialiased;
    display:flex;align-items:center;justify-content:center;padding:24px;
  }

  /* AMBIENT BACKGROUND — soft, slow ambient glow (no grid/cursor effects) */
  .bg-ambient{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;}
  .bg-ambient .orb{position:absolute;border-radius:50%;filter:blur(140px);}
  .bg-ambient .orb-1{width:620px;height:620px;background:var(--lilac);opacity:0.14;top:-220px;left:-160px;}
  .bg-ambient .orb-2{width:560px;height:560px;background:var(--sky);opacity:0.11;bottom:-220px;right:-160px;}
  @media (prefers-reduced-motion: no-preference){
    .bg-ambient .orb-1{animation:driftA 48s ease-in-out infinite;}
    .bg-ambient .orb-2{animation:driftB 54s ease-in-out infinite;}
  }
  @keyframes driftA{0%,100%{transform:translate(0,0);}50%{transform:translate(40px,30px);}}
  @keyframes driftB{0%,100%{transform:translate(0,0);}50%{transform:translate(-36px,-24px);}}

  h1{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:500;margin:0 0 8px;font-size:clamp(28px,4vw,36px);}
  .wrap{width:100%;max-width:420px;position:relative;z-index:1;}
  .logo-row{display:flex;justify-content:center;margin-bottom:28px;}
  .logo-row img{height:34px;width:auto;}
  .card{
    position:relative;
    background:linear-gradient(160deg, rgba(255,255,255,0.045), rgba(255,255,255,0.012));
    backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    border-left:3px solid var(--accent-bar);border-radius:16px;
    padding:36px 32px;
    box-shadow:0 24px 60px -20px rgba(0,0,0,0.6);
  }
  .card::before{
    content:'';position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
    background:linear-gradient(135deg, rgba(185,169,224,0.55), rgba(168,200,224,0.12) 45%, rgba(185,169,224,0.4));
    -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite:xor;mask-composite:exclude;
  }
  p.sub{color:var(--fog);font-size:14px;margin:0 0 28px;line-height:1.6;}
  label{display:block;font-size:12px;color:var(--fog);margin-bottom:6px;}
  input{
    width:100%;padding:12px 14px;border-radius:8px;
    border:1px solid var(--border-strong);background:var(--panel-2);
    color:var(--paper);font-size:15px;margin-bottom:18px;font-family:inherit;
  }
  input:focus{outline:none;border-color:var(--lilac);}
  button{
    width:100%;padding:13px;border-radius:8px;border:none;
    background:var(--gradient-primary);color:#fff;font-weight:600;font-size:15px;
    box-shadow:0 4px 20px rgba(190,60,190,0.35);
    cursor:pointer;font-family:inherit;
  }
  button:disabled{opacity:0.5;cursor:default;}
  .error-text{color:var(--error);font-size:13px;margin:-8px 0 16px;display:none;}
  .success-box{display:none;text-align:center;}
  .success-box p{color:var(--fog);font-size:14px;line-height:1.7;margin-bottom:22px;}
  .success-box a{
    display:inline-block;padding:13px 24px;border-radius:8px;
    background:var(--gradient-primary);color:#fff;font-weight:600;text-decoration:none;font-size:15px;
    box-shadow:0 4px 20px rgba(190,60,190,0.35);
  }
  .back-link{display:block;text-align:center;margin-top:22px;color:var(--fog);font-size:13px;text-decoration:none;}
  .back-link:hover{color:var(--paper);}
</style>
</head>
<body>

<div class="bg-ambient" aria-hidden="true">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
</div>

<div class="wrap">
  <div class="logo-row"><img src="assets/wordmark.png?v=2" alt="Voyeur"></div>

  <div class="card">
    <div id="formView">
      <h1 id="suHeading">Join the list.</h1>
      <p class="sub" id="suSubtext">Create your member account for priority entry, event access, and your own photo page.</p>

      <form id="signupForm" novalidate>
        <label for="suName" id="suNameLabel">Full name</label>
        <input type="text" id="suName" placeholder="Jordan Lee" autocomplete="name">

        <label for="suEmail" id="suEmailLabel">Email</label>
        <input type="email" id="suEmail" placeholder="you@example.com" autocomplete="email">

        <label for="suPhone" id="suPhoneLabel">Phone number</label>
        <input type="tel" id="suPhone" placeholder="(555) 555-5555" autocomplete="tel">

        <label for="suPassword" id="suPasswordLabel">Password</label>
        <input type="password" id="suPassword" placeholder="At least 8 characters" autocomplete="new-password">

        <p class="error-text" id="suError"></p>
        <button type="submit" id="suSubmit">Create account</button>
      </form>
    </div>

    <div class="success-box" id="successView">
      <h1 id="suSuccessHeading">You're in.</h1>
      <p id="suSuccessText">Your account's ready. Log in anytime to see upcoming events and your photos.</p>
      <a href="https://voyeur.netlify.app" target="_blank" rel="noopener" id="suSuccessLink">Log in now</a>
    </div>
  </div>

  <a class='back-link' href='/' id="suBackLink">← Back to site</a>
</div>

<script>
  var SUPABASE_URL      = 'https://lmopfcntexvepdzijdmu.supabase.co';
  var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxtb3BmY250ZXh2ZXBkemlqZG11Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc5NDkxODMsImV4cCI6MjEwMzUyNTE4M30.vvjJLkn3zGyoSp6FyTIcBF0FCZTzLnFUhcnmi-8IHl0';

  var DEFAULTS = {
    signup_heading: 'Join the list.',
    signup_subtext: 'Create your member account for priority entry, event access, and your own photo page.',
    signup_name_label: 'Full name',
    signup_name_placeholder: 'Jordan Lee',
    signup_email_label: 'Email',
    signup_email_placeholder: 'you@example.com',
    signup_phone_label: 'Phone number',
    signup_phone_placeholder: '(555) 555-5555',
    signup_password_label: 'Password',
    signup_password_placeholder: 'At least 8 characters',
    signup_button_label: 'Create account',
    signup_button_loading_label: 'Creating account…',
    signup_success_heading: "You're in.",
    signup_success_text: "Your account's ready. Log in anytime to see upcoming events and your photos.",
    signup_success_button_label: 'Log in now',
    signup_back_link_label: '← Back to site'
  };

  var LOADING_LABEL = DEFAULTS.signup_button_loading_label;
  var SUBMIT_LABEL = DEFAULTS.signup_button_label;

  function applyContent(content){
    document.getElementById('suHeading').textContent = content.signup_heading;
    document.getElementById('suSubtext').textContent = content.signup_subtext;
    document.getElementById('suNameLabel').textContent = content.signup_name_label;
    document.getElementById('suName').placeholder = content.signup_name_placeholder;
    document.getElementById('suEmailLabel').textContent = content.signup_email_label;
    document.getElementById('suEmail').placeholder = content.signup_email_placeholder;
    document.getElementById('suPhoneLabel').textContent = content.signup_phone_label;
    document.getElementById('suPhone').placeholder = content.signup_phone_placeholder;
    document.getElementById('suPasswordLabel').textContent = content.signup_password_label;
    document.getElementById('suPassword').placeholder = content.signup_password_placeholder;
    document.getElementById('suSubmit').textContent = content.signup_button_label;
    document.getElementById('suSuccessHeading').textContent = content.signup_success_heading;
    document.getElementById('suSuccessText').textContent = content.signup_success_text;
    document.getElementById('suSuccessLink').textContent = content.signup_success_button_label;
    document.getElementById('suBackLink').textContent = content.signup_back_link_label;
    LOADING_LABEL = content.signup_button_loading_label;
    SUBMIT_LABEL = content.signup_button_label;
  }

  var signupKeys = Object.keys(DEFAULTS).join(',');
  fetch(SUPABASE_URL + '/rest/v1/site_content?select=key,value&key=in.(' + signupKeys + ')', {
    headers: {
      apikey: SUPABASE_ANON_KEY,
      Authorization: 'Bearer ' + SUPABASE_ANON_KEY
    }
  })
    .then(function(r){ return r.ok ? r.json() : Promise.reject(); })
    .then(function(rows){
      var content = Object.assign({}, DEFAULTS);
      rows.forEach(function(row){
        if(row.value) content[row.key] = row.value;
      });
      applyContent(content);
    })
    .catch(function(){
      applyContent(DEFAULTS);
    });

  var form = document.getElementById('signupForm');
  var errorEl = document.getElementById('suError');
  var submitBtn = document.getElementById('suSubmit');

  form.addEventListener('submit', function(e){
    e.preventDefault();
    var name = document.getElementById('suName').value.trim();
    var email = document.getElementById('suEmail').value.trim();
    var phone = document.getElementById('suPhone').value.trim();
    var password = document.getElementById('suPassword').value;

    if(!name || !email || !phone || !password){
      errorEl.textContent = 'Please fill in every field.';
      errorEl.style.display = 'block';
      return;
    }
    if(password.length < 8){
      errorEl.textContent = 'Password must be at least 8 characters.';
      errorEl.style.display = 'block';
      return;
    }

    errorEl.style.display = 'none';
    submitBtn.disabled = true;
    submitBtn.textContent = LOADING_LABEL;

    fetch(SUPABASE_URL + '/functions/v1/public-signup', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        apikey: SUPABASE_ANON_KEY,
        Authorization: 'Bearer ' + SUPABASE_ANON_KEY
      },
      body: JSON.stringify({ name: name, email: email, phone: phone, password: password })
    })
      .then(function(r){ return r.json().then(function(body){ return { ok: r.ok, body: body }; }); })
      .then(function(res){
        if(!res.ok){
          errorEl.textContent = res.body.error || 'Something went wrong. Please try again.';
          errorEl.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.textContent = SUBMIT_LABEL;
          return;
        }
        document.getElementById('formView').style.display = 'none';
        document.getElementById('successView').style.display = 'block';
      })
      .catch(function(){
        errorEl.textContent = 'Could not reach the server. Check your connection and try again.';
        errorEl.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = SUBMIT_LABEL;
      });
  });
</script>

</body>
</html>
