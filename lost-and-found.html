<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lost & Found — Voyeur</title>
<link rel="icon" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;1,400;1,500;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14111c;
    --panel:#1e1a26;
    --panel-2:#262030;
    --lilac:#b9a9e0;
    --sky:#a8c8e0;
    --fog:#8f8f99;
    --paper:#f1f0f4;
    --border:rgba(216,180,255,0.10);
    --border-strong:rgba(216,180,255,0.20);
    --error:#e08a8a;
    --success:#9ed6a8;
    --gradient-primary:linear-gradient(135deg, #9333ea, #d6409f);
    --accent-bar:#c026d3;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;
    background:radial-gradient(circle at 20% 0%, #2a1f3d 0%, var(--ink) 60%);color:var(--paper);
    font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;
    display:flex;align-items:center;justify-content:center;padding:24px;
  }
  h1{font-family:'Fraunces',serif;font-weight:500;margin:0 0 8px;font-size:clamp(28px,4vw,36px);}
  .wrap{width:100%;max-width:460px;}
  .logo-row{display:flex;justify-content:center;margin-bottom:28px;}
  .logo-row img{height:80px;width:auto;}
  .card{
    background:var(--panel);border:1px solid var(--border);border-left:3px solid var(--accent-bar);border-radius:16px;
    padding:36px 32px;
  }
  p.sub{color:var(--fog);font-size:14px;margin:0 0 28px;line-height:1.6;}
  label{display:block;font-size:12px;color:var(--fog);margin-bottom:6px;}
  input,textarea{
    width:100%;padding:12px 14px;border-radius:8px;
    border:1px solid var(--border-strong);background:var(--panel-2);
    color:var(--paper);font-size:15px;margin-bottom:18px;font-family:inherit;
  }
  textarea{resize:vertical;min-height:70px;line-height:1.5;}
  input:focus,textarea:focus{outline:none;border-color:var(--lilac);}
  fieldset{border:none;padding:0;margin:0 0 18px;}
  legend{font-size:12px;color:var(--fog);margin-bottom:10px;padding:0;}
  .loc-grid{
    display:grid;grid-template-columns:1fr;gap:8px;
    border:1px solid var(--border-strong);border-radius:8px;padding:10px;
    background:var(--panel-2);max-height:240px;overflow-y:auto;
  }
  .loc-option{
    display:flex;align-items:center;gap:10px;padding:6px 4px;
    font-size:14px;color:var(--paper);cursor:pointer;
  }
  .loc-option input{width:auto;margin:0;accent-color:var(--lilac);}
  button{
    width:100%;padding:13px;border-radius:8px;border:none;
    background:var(--gradient-primary);color:#fff;font-weight:600;font-size:15px;
    box-shadow:0 4px 14px rgba(190,60,190,0.35);
    cursor:pointer;font-family:inherit;
  }
  button:disabled{opacity:0.5;cursor:default;}
  .error-text{color:var(--error);font-size:13px;margin:-8px 0 16px;display:none;}
  .success-box{display:none;text-align:center;}
  .success-box p{color:var(--fog);font-size:14px;line-height:1.7;margin-bottom:22px;}
  .success-box a{
    display:inline-block;padding:13px 24px;border-radius:8px;
    background:var(--gradient-primary);color:#fff;font-weight:600;text-decoration:none;font-size:15px;
    box-shadow:0 4px 14px rgba(190,60,190,0.35);
  }
  .back-link{display:block;text-align:center;margin-top:22px;color:var(--fog);font-size:13px;text-decoration:none;}
  .back-link:hover{color:var(--paper);}
</style>
</head>
<body>

<div class="wrap">
  <div class="logo-row"><img src="assets/wordmark.png" alt="Voyeur"></div>

  <div class="card">
    <div id="formView">
      <h1>Lost something?</h1>
      <p class="sub">Fill this out and we'll reach out if we find a match.</p>

      <form id="lfForm" novalidate>
        <label for="lfFirst">First name</label>
        <input type="text" id="lfFirst" autocomplete="given-name">

        <label for="lfLast">Last name</label>
        <input type="text" id="lfLast" autocomplete="family-name">

        <label for="lfEmail">Email</label>
        <input type="email" id="lfEmail" placeholder="you@example.com" autocomplete="email">

        <label for="lfPhone">Phone number</label>
        <input type="tel" id="lfPhone" placeholder="(555) 555-5555" autocomplete="tel">

        <label for="lfDate">Date of visit</label>
        <input type="date" id="lfDate">

        <label for="lfItem">Lost item</label>
        <textarea id="lfItem" placeholder="Please include brand and color if possible"></textarea>

        <fieldset>
          <legend>Last seen location — check one</legend>
          <div class="loc-grid" id="lfLocGrid">
            <label class="loc-option"><input type="radio" name="lfLocation" value="VOYEUR MEZZANINE"> VOYEUR MEZZANINE</label>
            <label class="loc-option"><input type="radio" name="lfLocation" value="VOYEUR MEZZANINE BATHROOM"> VOYEUR MEZZANINE BATHROOM</label>
            <label class="loc-option"><input type="radio" name="lfLocation" value="VOYEUR MEZZANINE PARLOR"> VOYEUR MEZZANINE PARLOR</label>
            <label class="loc-option"><input type="radio" name="lfLocation" value="VOYEUR MEZZANINE VIP SEATING"> VOYEUR MEZZANINE VIP SEATING</label>
            <label class="loc-option"><input type="radio" name="lfLocation" value="VOYEUR MAINFLOOR"> VOYEUR MAINFLOOR</label>
            <label class="loc-option"><input type="radio" name="lfLocation" value="VOYEUR MAINFLOOR BATHROOM"> VOYEUR MAINFLOOR BATHROOM</label>
            <label class="loc-option"><input type="radio" name="lfLocation" value="VOYEUR REDBULL BAR"> VOYEUR REDBULL BAR</label>
            <label class="loc-option"><input type="radio" name="lfLocation" value="VOYEUR COATCHECK / RECEPTION"> VOYEUR COATCHECK / RECEPTION</label>
            <label class="loc-option"><input type="radio" name="lfLocation" value="VOYEUR LOUNGE"> VOYEUR LOUNGE</label>
            <label class="loc-option"><input type="radio" name="lfLocation" value="VOYEUR LOUNGE BATHROOM"> VOYEUR LOUNGE BATHROOM</label>
          </div>
        </fieldset>

        <p class="error-text" id="lfError"></p>
        <button type="submit" id="lfSubmit">Submit report</button>
      </form>
    </div>

    <div class="success-box" id="successView">
      <h1>Got it.</h1>
      <p>We've logged your report. If a matching item turns up, we'll reach out at the email you gave us.</p>
      <a href="/">Back to site</a>
    </div>
  </div>

  <a class='back-link' href='/'>← Back to site</a>
</div>

<script>
  var SUPABASE_URL      = 'https://lmopfcntexvepdzijdmu.supabase.co';
  var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxtb3BmY250ZXh2ZXBkemlqZG11Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc5NDkxODMsImV4cCI6MjEwMzUyNTE4M30.vvjJLkn3zGyoSp6FyTIcBF0FCZTzLnFUhcnmi-8IHl0';
  var VOYEUR_CLUB_ID    = '3593ba8d-0a06-4b5c-9935-9b6b6611b6a8';

  var form = document.getElementById('lfForm');
  var errorEl = document.getElementById('lfError');
  var submitBtn = document.getElementById('lfSubmit');

  form.addEventListener('submit', function(e){
    e.preventDefault();
    var firstName = document.getElementById('lfFirst').value.trim();
    var lastName = document.getElementById('lfLast').value.trim();
    var email = document.getElementById('lfEmail').value.trim();
    var phone = document.getElementById('lfPhone').value.trim();
    var visitDate = document.getElementById('lfDate').value;
    var item = document.getElementById('lfItem').value.trim();
    var locationInput = document.querySelector('input[name="lfLocation"]:checked');

    if(!firstName || !lastName || !email || !phone || !visitDate || !item || !locationInput){
      errorEl.textContent = 'Please fill in every field, including a last seen location.';
      errorEl.style.display = 'block';
      return;
    }

    errorEl.style.display = 'none';
    submitBtn.disabled = true;
    submitBtn.textContent = 'Submitting…';

    fetch(SUPABASE_URL + '/rest/v1/lost_items', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        apikey: SUPABASE_ANON_KEY,
        Authorization: 'Bearer ' + SUPABASE_ANON_KEY,
        Prefer: 'return=minimal'
      },
      body: JSON.stringify({
        club_id: VOYEUR_CLUB_ID,
        first_name: firstName,
        last_name: lastName,
        email: email,
        phone: phone,
        visit_date: visitDate,
        item_description: item,
        location: locationInput.value
      })
    })
      .then(function(r){
        if(!r.ok){ throw new Error('submit failed'); }
        document.getElementById('formView').style.display = 'none';
        document.getElementById('successView').style.display = 'block';
      })
      .catch(function(){
        errorEl.textContent = 'Could not reach the server. Check your connection and try again.';
        errorEl.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Submit report';
      });
  });
</script>

</body>
</html>
